services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    ports:
      - "3235:3231"   # Map host port 3235 to container port 3231
    env_file:
      - .env.local
    environment:
      - PORT=3231
      - NODE_ENV=production
    restart: always
