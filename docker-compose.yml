services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    ports:
      - "3235:3231"   # Map unique host port 3235 to container port 3231
    volumes:
      - ./.env:/app/.env
    environment:
      - PORT=3231
      - NODE_ENV=production
      - DATABASE_URL=postgresql://splitwise:${POSTGRES_PASSWORD}@postgres:5432/splitwise
    depends_on:
      - postgres
      - minio
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: splitwise
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${TAILSCALE_IP}:5439:5432"   # Map unique host port 5439 strictly to VPS Tailscale IP
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${TAILSCALE_IP}:9099:9001"   # Map unique host port 9099 strictly to VPS Tailscale IP
      # MinIO API port (9000) is NOT exposed to any external interface. Next.js acts as an internal proxy.
    restart: always

volumes:
  postgres_data:
  minio_data:
