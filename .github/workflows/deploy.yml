name: CI/CD Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_EMAIL=${{ secrets.VAPID_EMAIL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production

    steps:
      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          ORA_DB_USER: ${{ secrets.ORA_DB_USER }}
          ORA_DB_PASSWORD: ${{ secrets.ORA_DB_PASSWORD }}
          ORA_CONNECT_STRING: ${{ secrets.ORA_CONNECT_STRING }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          OCI_STORAGE_BUCKET: ${{ secrets.OCI_STORAGE_BUCKET }}
          OCI_STORAGE_ENDPOINT: ${{ secrets.OCI_STORAGE_ENDPOINT }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          ORA_WALLET_ZIP_B64: ${{ secrets.ORA_WALLET_ZIP_B64 }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ADMIN_EMAIL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,BETTER_AUTH_SECRET,BETTER_AUTH_URL,NEXT_PUBLIC_VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_EMAIL,NEXT_PUBLIC_APP_URL,ORA_DB_USER,ORA_DB_PASSWORD,ORA_CONNECT_STRING,OCI_REGION,OCI_NAMESPACE,OCI_STORAGE_BUCKET,OCI_STORAGE_ENDPOINT,OCI_S3_ACCESS_KEY,OCI_S3_SECRET_KEY,ORA_WALLET_ZIP_B64,AI_API_KEY,INTERNAL_API_SECRET
          script: |
            mkdir -p ~/app
            cd ~/app

            echo "${{ secrets.DEPLOY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Provision Oracle Wallet if secret is present
            if [ ! -z "${ORA_WALLET_ZIP_B64}" ]; then
              echo "Extracting Oracle Wallet..."
              mkdir -p ~/app/wallet
              echo "${ORA_WALLET_ZIP_B64}" | base64 -d > ~/app/wallet.zip
              unzip -o ~/app/wallet.zip -d ~/app/wallet/
              rm -f ~/app/wallet.zip
            fi

            # Write docker-compose.yml with ALL env vars baked in directly.
            # No .env file, no volume mount, no dotenv needed - vars go straight into process.env.
            # Using key: value format (not KEY=VALUE list) so special chars in values don't break YAML.
            printf 'services:\n  web:\n    container_name: splitit-web\n    image: ghcr.io/${{ env.IMAGE_NAME }}:latest\n    ports:\n      - "3231:3231"\n    environment:\n      PORT: "3231"\n      NODE_ENV: production\n      ADMIN_EMAIL: "%s"\n      GOOGLE_CLIENT_ID: "%s"\n      GOOGLE_CLIENT_SECRET: "%s"\n      BETTER_AUTH_SECRET: "%s"\n      BETTER_AUTH_URL: "%s"\n      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "%s"\n      VAPID_PRIVATE_KEY: "%s"\n      VAPID_EMAIL: "%s"\n      NEXT_PUBLIC_APP_URL: "%s"\n      ORA_DB_USER: "%s"\n      ORA_DB_PASSWORD: "%s"\n      ORA_CONNECT_STRING: "%s"\n      OCI_REGION: "%s"\n      OCI_NAMESPACE: "%s"\n      OCI_STORAGE_BUCKET: "%s"\n      OCI_STORAGE_ENDPOINT: "%s"\n      OCI_S3_ACCESS_KEY: "%s"\n      OCI_S3_SECRET_KEY: "%s"\n      AI_API_KEY: "%s"\n      INTERNAL_API_SECRET: "%s"\n    volumes:\n      - ./wallet:/app/wallet\n    restart: always\n' \
              "${ADMIN_EMAIL}" \
              "${GOOGLE_CLIENT_ID}" \
              "${GOOGLE_CLIENT_SECRET}" \
              "${BETTER_AUTH_SECRET}" \
              "${BETTER_AUTH_URL}" \
              "${NEXT_PUBLIC_VAPID_PUBLIC_KEY}" \
              "${VAPID_PRIVATE_KEY}" \
              "${VAPID_EMAIL}" \
              "${NEXT_PUBLIC_APP_URL}" \
              "${ORA_DB_USER}" \
              "${ORA_DB_PASSWORD}" \
              "${ORA_CONNECT_STRING}" \
              "${OCI_REGION}" \
              "${OCI_NAMESPACE}" \
              "${OCI_STORAGE_BUCKET}" \
              "${OCI_STORAGE_ENDPOINT}" \
              "${OCI_S3_ACCESS_KEY}" \
              "${OCI_S3_SECRET_KEY}" \
              "${AI_API_KEY}" \
              "${INTERNAL_API_SECRET}" \
              > docker-compose.yml

            docker compose pull
            docker compose down
            docker compose up -d --remove-orphans
